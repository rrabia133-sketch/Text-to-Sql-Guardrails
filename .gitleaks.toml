# Gitleaks Configuration for Text-to-SQL Guardrails Workspace
title = "Text-to-SQL Secret Scanning Policy"

[extend]
useDefault = true

[[rules]]
id = "groq-api-key"
description = "Groq Cloud API Key"
regex = '''gsk_[A-Za-z0-9]{20,}'''
tags = ["key", "groq"]

[allowlist]
description = "Explicit placeholder values and documented synthetic test fixtures"
paths = [
  '''^\.env\.example$''',
  '''^docs/''',
  '''^scripts/secret-scan\.mjs$''',
]
regexes = [
  '''your_dev_session_secret_min_32_characters_here''',
  '''your_groq_api_key_here''',
  '''your_analytics_password''',
  '''your_app_password''',
  '''your_migrator_password''',
  '''postgres_dev_password_2026''',
  '''postgres_staging_password_2026''',
  '''staging_session_secret_min_32_characters_long_2026_!''',
  '''ci-test-session-secret-minimum-32-characters-long''',
  '''dev-session-secret-change-in-production-min-32-chars''',
  '''min_32_character_long_session_secret_!''',
  '''super_secret_password_123''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9''',
  '''eyJhbGciOi\.\.\.''',
  '''Production_Master_Backup_Key_2026_Secure!''',
  '''Wrong_Password_Attempt_1234''',
  '''RealLeakedTokenABCDEF1234567890''',
  '''analytics_password''',
  '''app_password''',
  '''migrator_password''',
  '''gsk_test_secret_key_1234567890abcdef''',
  '''gsk_live_secret_key_9999''',
]

